<script>
(function () { const errs = [];
  const note = m => { errs.push(String(m).slice(0, 160)); document.body && document.body.setAttribute('data-errors', errs.join(' | ')); };
  window.addEventListener('error', e => note(e.message));
  const cerr = console.error.bind(console); console.error = (...a) => { note(a.map(String).join(' ')); cerr(...a); }; })();
</script>
